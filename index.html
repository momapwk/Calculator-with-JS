<html>
    <head>
        <title>simple calculator</title>
        <link rel="stylesheet" href="c.css">
    </head>
    <body>
      
        <section class="calculator">
            <h1>Calculator</h1>
            <input type="text" id="display" disabled />
        
        <div class="buttons">
        <button class="ac" onclick="clearall()">AC</button>
        <button onclick="percent('%')">%</button>
        
        <button class="divide" onclick="divide('')">/</button>
        
        <button onclick="number('7')">7</button>  
        <button onclick="number('8')">8</button>
        <button onclick="number('9')">9</button>

        <button class="multiply" onclick="multiply('')"></button>

        <button onclick="number('4')">4</button>
        <button onclick="number('5')">5</button>
        <button onclick="number('6')">6</button>
        <button class="subtract" onclick="subtract('-')">-</button>  

        <button onclick="number('1')">1</button>
        <button onclick="number('2')">2</button>
        <button onclick="number('3')">3</button>
        <button class="add" onclick="add('+')">+</button>

        <button onclick="number('0')">0</button>
        <button onclick="decimal('.')">.</button>   
        <button onclick="equal()" class="equal ">=</button>  





        
        </div>
    </section>

        <script src="c.js"></script>
          
    </body>
</html>
